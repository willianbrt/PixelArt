<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painting - PixelArt</title>

    <link href="./../../styles/themes/dark.css" rel="stylesheet" type="text/css"></link>     
    <link href="assets/painting.css" rel="stylesheet" type="text/css"></link>
</head>
<body data-theme="dark">
    <section class="navbar">
        <div class="dropdown">
            <button class="dropdown-label">
                <img src="../../resource/img/logo.png" class="logo"/>
            </button>
            
            <div class="dropdown-menu">
                <div class="dropdown-item">${novo}</div>
                <div class="dropdown-item">${salvar}</div>

                <div class="dropdown-item">
                    ${export-as}
                    
                    <div class="dropdown-menu">
                        <div class="dropdown-item">JPG</div>
                        <div class="dropdown-item">PNG</div>
                        <div class  ="dropdown-item">GIF</div>
                    </div>
                </div>
                
                <div class="dropdown-item">${redimensionar}</div>
                <div class="dropdown-item">${atalhos}</div>
                <div class="dropdown-item">${configuracoes}</div>
            </div>
        </div>

        <div class="group">
            <button class="btn-ghost btn-premium"><img src="" /></button>
            
             <div class="dropdown">
                <button class="dropdown-label">
                    <img class="perfil-rounded" src="" />
                </button>
                
                <div class="dropdown-menu">
                    <div class="dropdown-item">${logout}</div>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <section class="pane" id="pane-left">
            <div class="pane-content" id="pane-tool">
                <div class="header">
                    <h4>
                        <i class="fa fa-toolbox"></i>
                    </h4>
                </div>

                <div class="body">
                    <button class="tool tool-pencil"><img src="../../../src/resource/img/pencil.png" /></button>
                    <button class="tool tool-brush"><img src="../../../src/resource/img/brush.png" /></button>
                    <button class="tool tool-eraser"><img src="../../../src/resource/img/eraser.png" /></button>
                    <button class="tool tool-bucket"><img src="../../../src/resource/img/bucket.png" /></button>
                    <button class="tool tool-line"><img src="../../../src/resource/img/line.png" /></button>
                    <button class="tool tool-square"><img src="../../../src/resource/img/square.png" /></button>
                    <button class="tool tool-circle"><img src="../../../src/resource/img/circle.png" /></button>
                    <button class="tool tool-dropper"><img src="../../../src/resource/img/dropper.png" /></button>
                </div>
            </div>
            
            <div class="pane-content" id="pane-wornking-colors">
                <div class="body">
                    <div class="working-colors">
                        <span class="work-color secondary-color" style="background-color:rgb(0,0,0)" data-color="rgb(0,0,0)"></span>
                        <span class="work-color primary-color" style="background-color:rgb(255,255,255)" data-color="rgb(255,255,255)"></span>
                    </div>
                </div>
            </div>
        </section>

        <section id="drawing-area">
            <canvas id="paintingCanvas" width="800" height="500"></canvas>
        </section>

        <section class="pane" id="pane-right">
            <div class="pane-content"> 
                <div class="pane-content" id="pane-layers">
                    <div class="header">
                        <h4>Camadas</h4>
                    </div>
                    
                    <div class="opacity">
                        <input class="slider" name="opacity-layer" type="range" value="1" min="0" max="100" />
                        <span id="opacity-label"><h5>Transparência %</h5></span>
                    </div>
                    
                    <div class="body" id="list-Layers">
                    </div>
                    
                    <div class="footer">
                        <button class="btn-ghost-action" id="add-layer"><i class="fa fa-plus"></i></button>
                        <button class="btn-ghost-action" id="duplicate-layer"><i class="fa fa-clone"></i></button>
                        <button class="btn-ghost-action" id="move-up-layer"><i class="fa fa-angle-up"></i></button>
                        <button class="btn-ghost-action" id="move-down-layer"><i class="fa fa-angle-down"></i></button>
                        <button class="btn-ghost-action" id="merge-layer"><i class="fa fa-circle-half-stroke"></i></button>
                        <button class="btn-ghost-action" id="remove-layer"><i class="fa fa-trash"></i></button>
                    </div>
                </div>
                
                <div class="pane-content" id="pane-colors">
                    <div class="body">
                        <div class="top-pane">
                            <select name="pallet"></select>
                            <button class="btn-ghost-action" id="add-pallet"><i class="fa fa-plus"></i></button>
                            <button class="btn-ghost-action" id="trash-pallet"><i class="fa fa-trash"></i></button>
                        </div>

                        <div class="" id="list-colors">
                            <button class="add-color"><i class="fa fa-plus"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active">
                    <h4>Camadas</h4>
                </div>

                <div class="tab">
                    <h4>Cores</h4>
                </div>
                <div class="tab">
                    <h4>Ferramentas</h4>
                </div>
                <div class="tab">
                    <h4>Opções</h4>
                </div>
            </div>
        </section>
    
        <section class="pane pane-frames" id="pane-footer">
            <div class="pane-content">
                <div class="header">
                    <h4>Quadros</h4>
                    <div class="v-group">
                        <label for="time-all-frame"><i class="fa fa-clock"></i></label>
                        <select id="time-all-frame">
                            <option value="60"><i class="fa fa-clock"></i> 60 ms</option>
                            <option value="60"><i class="fa fa-clock"></i> 60 ms</option>
                            <option value="60"><i class="fa fa-clock"></i> 60 ms</option>
                            <option value="60"><i class="fa fa-clock"></i> 60 ms</option>
                            <option value="60"><i class="fa fa-clock"></i> 60 ms</option>
                        </select>
                    </div>
                    
                    <button class="btn-ghost-action" id="animate-frames"><i class="fa fa-play"></i> Animar</button>
                    <button class="btn-ghost-action" id="add-frame"><i class="fa fa-plus"></i> Adicionar</button>
                    <button class="btn-ghost-action" id="remove-frame"><i class="fa fa-trash"></i> Remover</button>
                </div>
                <div class="body hidden">
                    <div class="top">
                        <button id="move-down-frame"><i class="fa fa-arrow-left"></i></button>
                        <button id="move-up-frame"><i class="fa fa-arrow-right"></i></button>
                        <button id="duplicate-frame"><i class="fa fa-clone"></i></button>
                        <button id="flip-x"><i class="fa fa-shuffle"></i></button>
                        <button id="flip-y"><i class="fa fa-shuffle"></i></button>
                    </div>

                    <div id="list-frames">
                    </div>
                </div>
            </div>
        </section>
    </section>

    <div class="modal hidden" id="modal-color-picker">
        <div class="modal-header">
            <div class="color-picker">
                <div class="cromatico">
                    <canvas id="color-picker" width="150" height="150" dragglable="false"></canvas>
                    <!-- <div id="color-picker" width="150" height="150" dragglable="false"></div> -->
                    <span class="marker" id="hue" data-hue="0"></span>
                    <span class="marker" id="color" data-saturation="0" data-light="0"></span>
                </div>
            </div>
        </div>
        <div class="modal-content">
            <div class="form-group col g-4" id="picker-control">
                <div class="row">
                    <span class="modal-color" id="new-color"></span>
                    <span class="modal-color" id="old-color"></span>
                </div>
            
                <div class="row">
                    <div class="input-group">
                        <span class="input-label">#</span>
                        <input name="hex" type="text"/>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col g-4">
                        <div class="input-group">
                            <span class="input-label">R</span>
                            <input name="r" type="number"/>
                        </div>
                        <div class="input-group">
                            <span class="input-label">G</span>
                            <input name="g" type="number"/>
                        </div>
                        <div class="input-group">
                            <span class="input-label">B</span>
                            <input name="b" type="number"/>
                        </div>
                    </div>
                    
                    <div class="col g-4">
                        <div class="input-group">
                            <span class="input-label">H</span>
                            <input name="h" type="number" />
                        </div>
                        <div class="input-group">
                            <span class="input-label">S</span>
                            <input name="s" type="number" max="100" min="0"/>
                        </div>
                        <div class="input-group">
                            <span class="input-label">L</span>
                            <input name="l" type="number" max="100" min="0"/>
                        </div>
                    </div>
                </div>

                <div class="row center">
                    <button class="btn-primary" id="add-color">Adicionar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal hidden" id="modal-pallete-name">
        <div class="modal-content">
            <div class="form-group col g-4">
                <div class="row">
                    <div class="input-group">
                        <span class="input-label">${Nome}</span>
                        <input name="name-pallete" type="text"/>
                    </div>
                </div>

                <div class="row center">
                    <button class="btn-primary" id="add-color">Adicionar</button>
                </div>
            </div>
        </div>
    </div>
    
   
    <script src="./js/c2.js" type="module"></script>
    <script>
        let selectPallet = document.querySelector("select[name='pallet']");
        let headerFrame = document.querySelector("#pane-footer .header");
        let btnAddColor= document.querySelector("#add-color");
        let listColors= document.getElementById("list-colors");
        
        let activeColor;
        let pallet = [{
            name: "Default",
            colors:[
                [255,0,0],
                [255,255,0],
            ]
        },
        {
            name: "Sombras",
            colors:[
                [255,0,0],
                [255,255,0],
            ]
        },
        {
            name: "Luzes",
            colors:[
                [255,0,0],
                [255,255,0],
            ]
        }];
        selectPallet.addEventListener("change", ()=> changeActivePallet());
        
        btnAddColor.addEventListener("click", function(){
            let r = document.querySelector("input[name=r]").value;
            let g = document.querySelector("input[name=g]").value;
            let b = document.querySelector("input[name=b]").value;

            addColor([r, g, b]);
        });
        headerFrame.addEventListener("click", function(e){
            if(e.target.classList.contains("header"))
                this.parentNode.querySelector(".body").classList.toggle("hidden")
        });
        function addColor(color){
            if(activePallet.colors.find((c)=>  c != color)){
                activePallet.colors.push(color);
            }

            let spanColor = listColors.querySelector(`.color[data-color='rgb(${color[0]}, ${color[1]}, ${color[2]})']`);

            if(spanColor === null){
                spanColor = document.createElement("span");
                spanColor.style.background = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                spanColor.className = "color";
                spanColor.dataset.color = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                listColors.append(spanColor);
                
                spanColor.addEventListener("click", function(){
                    swapActiveColor.call(this);
                });
            }

            swapActiveColor.call(spanColor);
        }
        function swapActiveColor(){
            document.querySelector(".color.active")?.classList.remove("active");
            this.classList.add("active");
        }
    </script>

    <script>
        var activePallet;
        var ctr = 1;
        window.onload=()=>{
            addFrame({});
            ctrFrame = listFrame.querySelectorAll("div.frame").length + 1;
            addLayer({});
            ctr = listLayer.querySelectorAll(".layer").length + 1;

            pallet.forEach(p => addPallet(p));
            changeActivePallet();
        }
        function changeActivePallet(){
            activePallet = pallet.find((p)=> p.name === selectPallet.value);
            activePallet.colors.forEach(color => addColor(color));
        }
        function addPallet(p){
            let optionPallet = document.createElement("option");
            optionPallet.value = p.name;
            optionPallet.innerText = p.name;
            selectPallet.append(optionPallet)
        }

        /* FRAMES */
        var ctrFrame = 1;
        let activeFrame;
        let listFrame = document.getElementById("list-frames");

        let btnAddFrame = document.getElementById("add-frame");
        let btnCloneFrame = document.getElementById("duplicate-frame");
        let btnMoveDownFrame = document.getElementById("move-down-frame");
        let btnMoveUpFrame = document.getElementById("move-up-frame");
        let btnRemoveFrame = document.getElementById("remove-frame");
        
        btnMoveDownFrame.addEventListener("click", function(){
            let frames = [...listFrame.querySelectorAll("div.frame")];
            let previousFrame = frames.indexOf(activeFrame) - 1;

            if(previousFrame>= 0)
                frames[previousFrame].before(activeFrame);
        });
        btnMoveUpFrame.addEventListener("click", function(){
            let frames = [...listFrame.querySelectorAll("div.frame")];
            let nextFrame = frames.indexOf(activeFrame) + 1;

            if(nextFrame < frames.length)
                frames[nextFrame].after(activeFrame);
        }
    );
        btnAddFrame.addEventListener("click", addFrame);
        btnRemoveFrame.addEventListener("click", function(){
            if(listFrame.querySelectorAll("div.frame").length <= 1) return;

            let frames = [...listFrame.querySelectorAll(".frame")];
            let indexActiveFrame = frames.indexOf(activeFrame);
            activeFrame.remove();

            frames = [...listFrame.querySelectorAll("div.frame")];

            if (frames.length === 0) return;

            let nextFrame;
            if (indexActiveFrame < frames.length) {
                nextFrame = frames[indexActiveFrame];
            } else {
                nextFrame = frames[frames.length - 1];
            }

            swapActiveFrame.call(nextFrame);
        });
        btnCloneFrame.addEventListener("click", function(){
            addFrame({});
        });
        
        function addFrame(options){
            let frame = document.createElement("div");
            let canvas = document.createElement("canvas");
            
            frame.classList.add("frame");
            canvas.id = options.id ?? ctrFrame;

            if(listFrame.querySelectorAll(".frame").length == 0){
                swapActiveFrame.call(frame);
            }

            frame.append(canvas);
            listFrame.prepend(frame);

            frame.addEventListener("click", swapActiveFrame);
            ctrFrame++;
        }
        function swapActiveFrame(){
            activeFrame?.classList.remove("active");
            this.classList.add("active");
            activeFrame = this;
        }

        /* LAYER */
        let activeLayer;
        let inpOpacity = document.querySelector("input[name='opacity-layer']");
        let listLayer = document.getElementById("list-Layers");

        let btnAddLayer = document.getElementById("add-layer");
        let btnCloneLayer = document.getElementById("duplicate-layer");
        let btnMoveDown = document.getElementById("move-down-layer");
        let btnMoveUp = document.getElementById("move-up-layer");
        let btnRemoveLayer = document.getElementById("remove-layer");
        
        inpOpacity.addEventListener("input", function(){
            document.querySelector("#opacity-label h5").innerText = "Transparência " + this.value + "%"
            activeLayer.dataset.opacity = this.value;
        });
        btnMoveDown.addEventListener("click", function(){
            let layers = [...listLayer.querySelectorAll(".layer")];
            let nextLayer = layers.indexOf(activeLayer) + 1;

            if(nextLayer < layers.length)
                layers[nextLayer].after(activeLayer);
        });
        btnMoveUp.addEventListener("click", function(){
            let layers = [...listLayer.querySelectorAll(".layer")];
            let previousLayer = layers.indexOf(activeLayer) - 1;

            if(previousLayer>= 0)
                layers[previousLayer].before(activeLayer);
        });
        btnAddLayer.addEventListener("click", addLayer);
        btnRemoveLayer.addEventListener("click", function(){
            if(listLayer.querySelectorAll(".layer").length <= 1) return;

            let layers = [...listLayer.querySelectorAll(".layer")];
            let indexActiveLayer = layers.indexOf(activeLayer);
            activeLayer.remove();

            layers = [...listLayer.querySelectorAll(".layer")];

            if (layers.length === 0) return;

            let nextLayer;
            if (indexActiveLayer < layers.length) {
                nextLayer = layers[indexActiveLayer];
            } else {
                nextLayer = layers[layers.length - 1];
            }

            swapActiveLayer.call(nextLayer);
        });
        btnCloneLayer.addEventListener("click", function(){
            let title = findTitle(activeLayer.dataset.title, 1);

            addLayer({
                title: title,
                ishidden: activeLayer.dataset.ishidden,
                islock: activeLayer.dataset.islock
            });
        });
        
        function findTitle(find, cntr) {
            const layers = [...listLayer.querySelectorAll(".layer")];
            const exists = layers.some(e => e.dataset.title === find);

            if (exists) {
                const newFind = `${find.replace(/\(\d+\)$/, '')}(${cntr})`;
                return findTitle(newFind, cntr + 1);
            }

            return find;
        }
        function addLayer(options){
            let layer = document.createElement("div");
            let nameLayer = document.createElement("div");
            let h5 = document.createElement("h5");
            let btnHideLayer = document.createElement("button");
            let btnLockLayer = document.createElement("button");
            let btnGrabLayer = document.createElement("button");
            
            layer.classList.add("layer");
            layer.id = options.id ?? ctr;
            layer.dataset.islock = options.islock ?? false;
            layer.dataset.ishidden = options.ishidden ??false;
            layer.dataset.title = options.title ?? findTitle("Layer " + ctr, 1);
            layer.dataset.opacity = options.opacity ?? 100;

            if(listLayer.querySelectorAll(".layer").length == 0){
                swapActiveLayer.call(layer);
            }

            nameLayer.className = "text";
            nameLayer.className = "name-layer"
            h5.innerText = layer.dataset.title;

            btnHideLayer.className = "hide-layer";
            btnHideLayer.innerHTML = "<i class=\"fa fa-eye\"></i>";

            btnLockLayer.className = "lock-layer";
            btnLockLayer.innerHTML = "<i class=\"fa fa-lock\"></i>";

            btnGrabLayer.className = "grab-layer";
            btnGrabLayer.innerHTML = "<i class=\"fa fa-grip-lines\"></i>";

            layer.append(btnHideLayer);
            nameLayer.append(h5);
            layer.append(nameLayer);
            layer.append(btnLockLayer);
            layer.append(btnGrabLayer);
            listLayer.prepend(layer);

            layer.addEventListener("click", swapActiveLayer);
            btnLockLayer.addEventListener("click", function(){
                let isLocking = layer.getAttribute("data-islock") === "true";
                let icon = this.querySelector("i");
                
                if(!isLocking){
                    icon.classList.remove("fa-unlock");
                    icon.classList.add("fa-lock");
                    layer.dataset.islock = true;
                    return;
                }
                layer.dataset.islock = false;
                icon.classList.remove("fa-lock");
                icon.classList.add("fa-unlock");
            });
            btnHideLayer.addEventListener("click", function(){
                let isHidden = layer.getAttribute("data-ishidden") === "true";
                let icon = this.querySelector("i");
                
                if(!isHidden){
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");

                    layer.classList.add("hidden-layer");
                    layer.dataset.ishidden = true;
                    return;
                }
                
                layer.dataset.ishidden = false;
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");

                layer.classList.remove("hidden-layer");
            });
            btnGrabLayer.addEventListener("mousedown", (e) => {
                let abort = new AbortController();
                e.preventDefault();
            
                window.addEventListener("mousemove", (e)=> {
                    listLayer.querySelectorAll(".layer").forEach(el => el.classList.remove("swap"));
                    e.target.closest(".layer")?.classList.add("swap");
                },{signal: abort.signal});
                window.addEventListener("mouseup", (e)=>{
                    e.target?.closest(".layer").classList.remove("swap");
                    e.target?.closest(".layer").after(layer);
                    abort.abort();
                }, { once: true });
            });
            nameLayer.addEventListener("dblclick", function(e){
                let inpNameLayer = document.createElement("input");
                inpNameLayer.value = layer.dataset.title;
                inpNameLayer.type = "text";

                nameLayer.replaceChild(inpNameLayer, h5);
                inpNameLayer.focus();
                inpNameLayer.addEventListener("blur", function(){
                    if(inpNameLayer.value == ""){
                        nameLayer.replaceChild(h5, inpNameLayer);
                        return;
                    }

                    layer.dataset.title = findTitle(inpNameLayer.value, 1);
                    h5.innerText = layer.dataset.title;
                    nameLayer.replaceChild(h5, inpNameLayer);
                });
                inpNameLayer.addEventListener("keypress", function(e){
                    if(e.keyCode == 13)
                        inpNameLayer.blur();
                });
            });
            ctr++;
        }
        function swapActiveLayer(){
            activeLayer?.classList.remove("active");
            this.classList.add("active");
            activeLayer = this;

            document.querySelector("#opacity-label h5").innerText = "Transparência " + activeLayer.dataset.opacity + "%"
            inpOpacity.value = activeLayer.dataset.opacity;
        }
    </script>
</body>
</html>
